syntax = "proto3";

package mqtt_gnss;

// GNSS payload + correlation metadata. Mirrors mqtt_gnss.gnss_data.GnssRecord.
message GnssRecord {
  // Correlation / measurement metadata
  uint64 seq      = 1;
  uint64 sent_ns  = 2;

  // GNSS payload
  string time_utc    = 3;
  string status      = 4;
  double latitude    = 5;
  string lat_hemi    = 6;
  double longitude   = 7;
  string lon_hemi    = 8;
  double speed_knots = 9;
  double course_deg  = 10;
  string date        = 11;
  double mag_var     = 12;
  string mag_var_dir = 13;
  string mode        = 14;
  string checksum    = 15;
}
